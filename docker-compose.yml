services:
  residential-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: residential-proxy:latest
    container_name: residential-proxy
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PROXY_USER: ${PROXY_USER:?defina PROXY_USER}
      PROXY_PASSWORD: ${PROXY_PASSWORD:?defina PROXY_PASSWORD}
    ports:
      - "${BIND_ADDR:?defina BIND_ADDR}:8888:8888"
      - "${BIND_ADDR:?defina BIND_ADDR}:1080:1080"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
      - /run:rw,noexec,nosuid,size=16m,mode=1777
      - /var/log/3proxy:rw,noexec,nosuid,size=32m,mode=1777
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 64M
    mem_limit: 64m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8888 && nc -z 127.0.0.1 1080 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
